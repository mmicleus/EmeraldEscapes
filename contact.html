<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emerald Escapes | Holidays and short breaks in Ireland</title>
    <!-- adding Bootstrap  -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
    <!-- importing Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- linking external CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="contact-page">
    <!-- navbar -->

    <nav class="navbar md:navbar-expand bg-body-tertiary" id="primary-nav">
      <div class="md:container">
        <a class="navbar-brand" href="./index.html" id="logo"
          >Emerald Escapes</a
        >
        <button
          class="btn-icon navbar-toggler"
          type="button"
          data-bs-toggle="drawer"
          data-bs-target="#navbarDrawer"
          aria-controls="navbarDrawer"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog
          class="drawer drawer-end"
          tabindex="-1"
          id="navbarDrawer"
          aria-labelledby="navbarDrawerLabel"
        >
          <div class="drawer-header">
            <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="drawer"
              aria-label="Close"
            ></button>
          </div>
          <div class="drawer-body mb-2 md:mb-0">
            <ul class="nav navbar-nav ms-auto" id="menu-list">
              <li class="nav-item">
                <a
                  class="nav-link active"
                  aria-current="page"
                  href="./index.html"
                  >Home</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./experiences.html">Experiences</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./contact.html">Contact</a>
              </li>
              <li class="nav-item">
                <button class="nav-link" id="theme-toggle" type="button">
                  Dark / light
                </button>
              </li>
            </ul>
          </div>
        </dialog>
      </div>
    </nav>

    <main
      id="contact-content"
      class="md:container d-flex flex-column gap-5 p-5"
    >
      <div class="md:container d-flex flex-column gap-5 p-5">
        <h3 class="fw-bold">Booking Enquiry</h3>

        <p>Make an enquiry and we will reply in no time</p>

        <!-- The form -->
        <form id="form" class="p-5">
          <div class="formField">
            <label for="nameInput" class="form-label">Name *</label>
            <input type="text" class="form-control mb-5" id="nameInput" />
            <p class="error" id="name-error"></p>
          </div>
          <!-- email input -->

          <div class="formField">
            <label for="emailInput" class="form-label fw-bold">Email *</label>
            <input
              type="email"
              class="form-control mb-5"
              id="emailInput"
              placeholder="name@example.com"
            />
            <p class="error" id="email-error"></p>
          </div>

          <div class="formField">
            <!-- phone input -->
            <label for="phoneInput" class="form-label fw-bold">Phone *</label>
            <input
              type="text"
              class="form-control mb-5"
              id="phoneInput"
              placeholder="+353 87 123 4567"
            />
            <p class="error" id="phone-error"></p>
          </div>

          <!-- query type selection  -->

          <div class="form-field mb-5">
            <label for="queryTypeSelect" class="form-label fw-bold"
              >Query type *</label
            >
            <select class="form-control" id="queryTypeSelect">
              <option selected value="0">Choose one</option>
              <option value="1">Booking</option>
              <option value="2">Payment</option>
              <option value="3">General Information</option>
              <option value="4">Other</option>
            </select>
            <p class="error" id="query-error"></p>
          </div>

          <!-- message input -->

          <div class="form-field mb-5">
            <label for="messageInput" class="form-label fw-bold">Message</label>
            <textarea
              class="form-control"
              id="messageInput"
              rows="3"
            ></textarea>
            <p class="error" id="message-error"></p>
          </div>

          <button class="btn btn-solid" type="submit">Send enquiry</button>

          <div
            class="alert alert-success mt-5 d-none"
            role="alert"
            id="success-alert"
          >
            Thank your for your enquiry. A member of our team will assist you as
            soon as possible
          </div>
        </form>
      </div>

      <!-- end of the form -->
    </main>

    <footer
      class="container-fluid d-flex justify-content-center align-items-center p-5"
      id="footer"
    >
      <div>&copy; <span id="year">2026</span> Emerald Escapes</div>
    </footer>
    <script src="js/main.js"></script>
    <script src="js/contact.js"></script>
  </body>
</html>
